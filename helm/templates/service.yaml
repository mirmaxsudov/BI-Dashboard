apiVersion: v1
kind: Service
metadata:
  name: {{ include "bi-dashboard.fullname" . }}
  labels:
    {{- include "bi-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "bi-dashboard.selectorLabels" . | nindent 4 }}
